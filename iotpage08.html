<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <!--html : Table Tag (block tag)-->
   <!-- ตารางที่แต่ละแถวมีจำนวนคอลัมน์เท่ากัน-->
    <table border="1" width="400">
        <tr>
            <td>a</td>
            <td>b</td>
            <td>c</td>
            <td>d</td>
        </tr>
        <tr>
            <td>e</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
        </tr>
        <tr>
            <td>i</td>
            <td>j</td>
            <td>k</td>
            <td>l</td>
        </tr>
        <tr>
            <td>m</td>
            <td>n</td>
            <td>o</td>
            <td>p</td>
        </tr>

    </table>

    <br/><br/>
    
   <!-- ตารางที่แต่ละแถวมีจำนวนคอลัมน์ไม่เท่ากัน-->
       <table border="1" width="400">
        <tr>
            <td colspan="2">a</td>
            <td>b</td>
            <td>c</td>
        </tr>
        <tr>
            <td rowspan="2">d</td>
            <td>e</td>
            <td colspan="2">f</td>
        </tr>
        <tr>
            <td colspan="2">g</td>
            <td rowspan="2">h</td>
        </tr>
        <tr>
            <td>i</td>
            <td>j</td>
            <td>k</td>
        </tr>

       </table>

       <br/><br/>

       <!--ตารางที่มี Header หรือ Footer-->
       <table border="1" width="400">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1111</td>
                <td>สมหมาย</td>
                <td>26</td>
            </tr>
            <tr>
                <td>2222</td>
                <td>สมศรี</td>
                <td>25</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">อายุรวมกัน</th>
                <td>55</td>
            </tr>
        </tfoot>

       </table>
    
   


  </body>
</html>
