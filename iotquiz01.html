<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <h1 style="text-align: center;">My TABLE TEST</h1>
    <h1 style="text-align: center;">^_^</h1>
    <!--โจทย์สร้างตารางให้เหมือนกับรูปที่ส่งไปในแชทล่าสุด-->
    <table border="1" width="800">
      <tr><!--1-->
        <td>1</td>
        <td colspan="2" rowspan="2">1</td>
        <td>1</td>
        <td colspan="2">1</td>
        <td rowspan="5">1</td>
      </tr>
      <tr><!--2-->
        <td>2</td>
        <td>2</td>
        <td>2</td>
        <td rowspan="3">2</td>
      </tr>
      <tr><!--3-->
        <td rowspan="3">3</td>
        <td>3</td>
        <td colspan="3" rowspan="2">3</td>
      </tr>
      <tr><!--4-->
        <td>4</td>
      </tr>
      <tr><!--5-->
        <td colspan="2">5</td>
        <td rowspan="2">5</td>
        <td>5</td>
        <td>5</td>
      </tr>
      <tr><!--6-->
        <td>6</td>
        <td>6</td>
        <td>6</td>
        <td colspan="2" rowspan="2">6</td>
        <td>6</td>
      </tr>      
      <tr><!--7-->
        <td colspan="3" rowspan="2">7</td>
        <td>7</td>
        <td rowspan="2">7</td>
      </tr>
      <tr><!--8-->
        <td>8</td>
        <td>8</td>
        <td>8</td>
      </tr>

      

    </table>

  </body>
</html>
